<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="60%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <linearGradient id="wallGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>
    <linearGradient id="lampGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FDE047" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#78350F" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" rx="24" fill="url(#bg2)" />

  <!-- Back Room Wall with Wood Paneling -->
  <rect x="40" y="40" width="720" height="250" rx="12" fill="url(#wallGradient)" />
  <line x1="160" y1="40" x2="160" y2="290" stroke="#92400E" stroke-width="2" opacity="0.4" />
  <line x1="280" y1="40" x2="280" y2="290" stroke="#92400E" stroke-width="2" opacity="0.4" />
  <line x1="400" y1="40" x2="400" y2="290" stroke="#92400E" stroke-width="2" opacity="0.4" />
  <line x1="520" y1="40" x2="520" y2="290" stroke="#92400E" stroke-width="2" opacity="0.4" />
  <line x1="640" y1="40" x2="640" y2="290" stroke="#92400E" stroke-width="2" opacity="0.4" />

  <!-- Bookshelf / Art frame on Wall -->
  <rect x="300" y="70" width="200" height="110" rx="8" fill="#1C1917" stroke="#D97706" stroke-width="3" />
  <rect x="315" y="85" width="170" height="80" rx="4" fill="#B45309" opacity="0.6" />
  <text x="400" y="132" font-family="serif" font-size="18" font-style="italic" fill="#FEF3C7" text-anchor="middle">Lounge &amp; Harmony</text>

  <!-- Floor Carpet with Warm Geometric Pattern -->
  <ellipse cx="400" cy="400" rx="340" ry="90" fill="#92400E" opacity="0.25" />
  <ellipse cx="400" cy="400" rx="300" ry="75" fill="#D97706" opacity="0.35" />
  <ellipse cx="400" cy="400" rx="260" ry="60" fill="#F59E0B" opacity="0.3" />

  <!-- Left Standing Floor Lamp -->
  <line x1="130" y1="120" x2="130" y2="390" stroke="#1C1917" stroke-width="6" stroke-linecap="round" />
  <ellipse cx="130" cy="390" rx="28" ry="8" fill="#1C1917" />
  <!-- Lamp Shade -->
  <path d="M 100 120 L 160 120 L 175 170 L 85 170 Z" fill="#D97706" stroke="#B45309" stroke-width="2" />
  <!-- Warm Lamp Light Cone -->
  <polygon points="130,170 50,420 220,420" fill="url(#lampGlow)" />

  <!-- Left Velvet Armchair -->
  <path d="M 190 280 Q 250 250 290 290 L 290 380 Q 230 400 190 380 Z" fill="#B45309" filter="url(#shadow2)" />
  <rect x="180" y="290" width="30" height="80" rx="15" fill="#92400E" />
  <rect x="270" y="290" width="30" height="80" rx="15" fill="#92400E" />
  <ellipse cx="240" cy="350" rx="45" ry="25" fill="#D97706" />
  <!-- Legs -->
  <line x1="200" y1="380" x2="190" y2="425" stroke="#1C1917" stroke-width="5" stroke-linecap="round" />
  <line x1="280" y1="380" x2="290" y2="425" stroke="#1C1917" stroke-width="5" stroke-linecap="round" />

  <!-- Right Velvet Armchair -->
  <path d="M 610 280 Q 550 250 510 290 L 510 380 Q 570 400 610 380 Z" fill="#B45309" filter="url(#shadow2)" />
  <rect x="500" y="290" width="30" height="80" rx="15" fill="#92400E" />
  <rect x="590" y="290" width="30" height="80" rx="15" fill="#92400E" />
  <ellipse cx="560" cy="350" rx="45" ry="25" fill="#D97706" />
  <!-- Legs -->
  <line x1="520" y1="380" x2="510" y2="425" stroke="#1C1917" stroke-width="5" stroke-linecap="round" />
  <line x1="600" y1="380" x2="610" y2="425" stroke="#1C1917" stroke-width="5" stroke-linecap="round" />

  <!-- Center Marble Coffee Table -->
  <ellipse cx="400" cy="385" rx="100" ry="40" fill="#1C1917" opacity="0.2" />
  <!-- Legs -->
  <line x1="340" y1="350" x2="330" y2="420" stroke="#78350F" stroke-width="6" stroke-linecap="round" />
  <line x1="460" y1="350" x2="470" y2="420" stroke="#78350F" stroke-width="6" stroke-linecap="round" />
  <!-- Tabletop Solid Oak with Brass Trim -->
  <ellipse cx="400" cy="345" rx="110" ry="45" fill="#FBBF24" filter="url(#shadow2)" />
  <ellipse cx="400" cy="342" rx="105" ry="42" fill="#FEF3C7" />
  <ellipse cx="400" cy="340" rx="98" ry="36" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" />

  <!-- Items on Table: Steaming Teapot, Cups & Macarons -->
  <!-- Teapot -->
  <ellipse cx="380" cy="330" rx="20" ry="12" fill="#B45309" />
  <path d="M 370 320 C 370 305 390 305 390 320 Z" fill="#B45309" />
  <circle cx="380" cy="302" r="4" fill="#D97706" />
  <!-- Handle -->
  <path d="M 360 325 C 350 320 350 335 362 333" stroke="#B45309" stroke-width="3" fill="none" />
  <!-- Spout with Steam -->
  <path d="M 395 330 Q 405 320 408 322" stroke="#B45309" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M 408 315 Q 412 305 408 295 T 414 280" stroke="#D97706" stroke-width="2" fill="none" opacity="0.7" stroke-linecap="round" />

  <!-- Coffee Cup -->
  <ellipse cx="435" cy="342" rx="12" ry="7" fill="#D97706" />
  <ellipse cx="435" cy="340" rx="10" ry="5" fill="#451A03" />

  <!-- Macaron plate -->
  <ellipse cx="350" cy="346" rx="18" ry="8" fill="#F59E0B" opacity="0.7" />
  <circle cx="345" cy="343" r="5" fill="#F43F5E" />
  <circle cx="355" cy="343" r="5" fill="#10B981" />

  <!-- Table Badge Pill -->
  <g transform="translate(320, 25)">
    <rect width="160" height="38" rx="19" fill="#92400E" filter="url(#shadow2)" />
    <circle cx="22" cy="19" r="10" fill="#FBBF24" />
    <text x="22" y="24" font-family="sans-serif" font-size="12" font-weight="bold" fill="#78350F" text-anchor="middle">2</text>
    <text x="92" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#FFFBEB" text-anchor="middle">СТОЛИК №2</text>
  </g>
</svg>
