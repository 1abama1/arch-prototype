<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF2FF" />
      <stop offset="60%" stop-color="#E0E7FF" />
      <stop offset="100%" stop-color="#C7D2FE" />
    </linearGradient>
    <linearGradient id="neonBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="cocktailShaker" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="martiniLiquor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E1B4B" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" rx="24" fill="url(#bg5)" />

  <!-- Night Bar Backdrop with Neon Mood -->
  <rect x="40" y="40" width="720" height="260" rx="12" fill="url(#neonBack)" />

  <!-- Neon Wall Sign: "MIXOLOGY & CRAFT" -->
  <rect x="260" y="65" width="280" height="40" rx="20" fill="#312E81" stroke="#818CF8" stroke-width="2" />
  <text x="400" y="90" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="4" fill="#A5B4FC" text-anchor="middle">CRAFT BAR &amp; MIXOLOGY</text>

  <!-- Illuminated Bar Shelves with Glowing Bottles -->
  <rect x="80" y="140" width="640" height="8" rx="2" fill="#818CF8" opacity="0.6" />
  <!-- Bottles on Shelf 1 -->
  <rect x="110" y="112" width="16" height="28" rx="3" fill="#38BDF8" opacity="0.8" />
  <rect x="135" y="105" width="18" height="35" rx="3" fill="#A855F7" opacity="0.8" />
  <rect x="162" y="115" width="15" height="25" rx="3" fill="#34D399" opacity="0.8" />
  <rect x="187" y="108" width="20" height="32" rx="3" fill="#F43F5E" opacity="0.8" />

  <rect x="590" y="108" width="18" height="32" rx="3" fill="#FBBF24" opacity="0.8" />
  <rect x="618" y="102" width="16" height="38" rx="3" fill="#38BDF8" opacity="0.8" />
  <rect x="643" y="114" width="20" height="26" rx="3" fill="#EC4899" opacity="0.8" />
  <rect x="672" y="106" width="16" height="34" rx="3" fill="#4ADE80" opacity="0.8" />

  <rect x="80" y="210" width="640" height="8" rx="2" fill="#818CF8" opacity="0.6" />
  <!-- Bottles on Shelf 2 -->
  <rect x="120" y="178" width="20" height="32" rx="3" fill="#F472B6" opacity="0.8" />
  <rect x="150" y="172" width="18" height="38" rx="3" fill="#60A5FA" opacity="0.8" />
  <rect x="610" y="172" width="22" height="38" rx="3" fill="#818CF8" opacity="0.8" />
  <rect x="640" y="178" width="18" height="32" rx="3" fill="#34D399" opacity="0.8" />

  <!-- Bar Counter: Glossy Dark Marble with Indigo Ambient Underlight -->
  <polygon points="0,290 800,290 800,500 0,500" fill="#0F172A" />
  <line x1="0" y1="290" x2="800" y2="290" stroke="#6366F1" stroke-width="6" />

  <!-- Bar Floor Ambient Circle -->
  <ellipse cx="400" cy="410" rx="320" ry="70" fill="#312E81" opacity="0.3" />

  <!-- Centerpiece: Stainless Steel Shaker & Modern Cocktail Glass -->
  <!-- Cocktail Shaker -->
  <g transform="translate(260, 270)">
    <!-- Shaker Body -->
    <path d="M 25 150 L 35 60 L 75 60 L 85 150 Z" fill="url(#cocktailShaker)" filter="url(#shadow5)" />
    <!-- Middle Cap -->
    <path d="M 33 60 L 40 30 L 70 30 L 77 60 Z" fill="url(#cocktailShaker)" />
    <!-- Top Cap -->
    <ellipse cx="55" cy="28" rx="14" ry="7" fill="#CBD5E1" />
  </g>

  <!-- Elegant Martini Glass -->
  <g transform="translate(420, 260)">
    <!-- Liquid Cone -->
    <polygon points="40,90 90,40 10,40" fill="url(#martiniLiquor)" opacity="0.9" />
    <!-- Glass Triangle Outline -->
    <polygon points="50,110 100,30 0,30" fill="#FFFFFF" opacity="0.25" stroke="#E0E7FF" stroke-width="2" />
    <!-- Stem and Base -->
    <line x1="50" y1="110" x2="50" y2="165" stroke="#E0E7FF" stroke-width="4" stroke-linecap="round" />
    <ellipse cx="50" cy="165" rx="35" ry="6" fill="#A5B4FC" opacity="0.8" />

    <!-- Toothpick with Green Olive -->
    <line x1="15" y1="20" x2="70" y2="80" stroke="#FDE047" stroke-width="2.5" />
    <circle cx="45" cy="53" r="10" fill="#84CC16" />
    <circle cx="45" cy="53" r="3" fill="#DC2626" />

    <!-- Lemon Twist Garnish -->
    <path d="M 95 30 Q 115 25 108 40" stroke="#FBBF24" stroke-width="4" fill="none" stroke-linecap="round" />
  </g>

  <!-- Ice Bucket & Tongs on Right -->
  <rect x="580" y="370" width="70" height="60" rx="8" fill="#475569" opacity="0.8" />
  <rect x="575" y="365" width="80" height="8" rx="3" fill="#94A3B8" />
  <!-- Ice cubes sticking out -->
  <rect x="595" y="352" width="18" height="16" rx="3" fill="#E0F2FE" opacity="0.8" />
  <rect x="620" y="355" width="16" height="15" rx="3" fill="#BAE6FD" opacity="0.8" />

  <!-- Table Badge Pill -->
  <g transform="translate(320, 20)">
    <rect width="160" height="38" rx="19" fill="#1E1B4B" filter="url(#shadow5)" />
    <circle cx="22" cy="19" r="10" fill="#818CF8" />
    <text x="22" y="24" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1E1B4B" text-anchor="middle">5</text>
    <text x="92" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#EEF2FF" text-anchor="middle">СТОЛИК №5</text>
  </g>
</svg>
