<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2" />
      <stop offset="60%" stop-color="#FCE7F3" />
      <stop offset="100%" stop-color="#FBCFE8" />
    </linearGradient>
    <linearGradient id="wallRose" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#881337" />
      <stop offset="100%" stop-color="#4C0519" />
    </linearGradient>
    <linearGradient id="goldOrnament" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow6" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#881337" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" rx="24" fill="url(#bg6)" />

  <!-- Warm Festive Hall Arch Wall with Central Chandelier -->
  <rect x="40" y="40" width="720" height="260" rx="16" fill="url(#wallRose)" />

  <!-- Traditional Ornamental Carpet Motifs on Back Wall -->
  <g stroke="#FBBF24" stroke-width="2" fill="none" opacity="0.4">
    <path d="M 120 120 L 140 100 L 160 120 L 140 140 Z" />
    <circle cx="140" cy="120" r="8" />
    <path d="M 640 120 L 660 100 L 680 120 L 660 140 Z" />
    <circle cx="660" cy="120" r="8" />
    <path d="M 380 90 L 400 70 L 420 90 L 400 110 Z" />
    <circle cx="400" cy="90" r="10" />
  </g>

  <!-- Warm Festive Chandelier Droplets -->
  <line x1="400" y1="40" x2="400" y2="90" stroke="#FBBF24" stroke-width="3" />
  <ellipse cx="400" cy="95" rx="35" ry="8" fill="url(#goldOrnament)" />
  <circle cx="375" cy="115" r="5" fill="#FDE047" />
  <circle cx="390" cy="122" r="6" fill="#FDE047" />
  <circle cx="400" cy="125" r="7" fill="#FDE047" />
  <circle cx="410" cy="122" r="6" fill="#FDE047" />
  <circle cx="425" cy="115" r="5" fill="#FDE047" />

  <!-- Banquet Hall Floor -->
  <polygon points="0,280 800,280 800,500 0,500" fill="#FDF2F8" />
  <ellipse cx="400" cy="410" rx="360" ry="85" fill="#F43F5E" opacity="0.15" />

  <!-- Large Round Feast Table with Silk Tablecloth -->
  <ellipse cx="400" cy="470" rx="180" ry="25" fill="#4C0519" opacity="0.2" />
  <!-- Table Pillar -->
  <rect x="385" y="370" width="30" height="90" rx="6" fill="#9F1239" />
  <ellipse cx="400" cy="460" rx="55" ry="12" fill="#881337" />

  <!-- Feast Tabletop with Silk Runner -->
  <ellipse cx="400" cy="370" rx="200" ry="65" fill="#FFFFFF" filter="url(#shadow6)" />
  <ellipse cx="400" cy="368" rx="185" ry="55" fill="#FFF1F2" />
  <!-- Crimson / Gold Silk Runner -->
  <ellipse cx="400" cy="366" rx="145" ry="42" fill="#E11D48" opacity="0.85" />
  <ellipse cx="400" cy="365" rx="135" ry="38" stroke="#FDE047" stroke-width="2" fill="none" />

  <!-- Traditional Choynak (Teapot) in Center -->
  <g transform="translate(365, 305)">
    <!-- Teapot Body -->
    <ellipse cx="35" cy="35" rx="26" ry="20" fill="#FFFFFF" stroke="#FBBF24" stroke-width="2.5" />
    <!-- Blue/Gold Traditional Floral Detail -->
    <circle cx="35" cy="35" r="8" fill="#3B82F6" />
    <circle cx="35" cy="35" r="4" fill="#FBBF24" />
    <!-- Lid & Finial -->
    <ellipse cx="35" cy="17" rx="14" ry="5" fill="#FFFFFF" stroke="#FBBF24" stroke-width="1.5" />
    <circle cx="35" cy="11" r="4" fill="#FBBF24" />
    <!-- Curved Handle -->
    <path d="M 12 25 C -5 20 -5 45 12 45" stroke="#FBBF24" stroke-width="4" fill="none" />
    <!-- Spout with Gentle Steam -->
    <path d="M 58 35 Q 75 25 72 20" stroke="#FBBF24" stroke-width="4" fill="none" stroke-linecap="round" />
    <path d="M 75 16 Q 80 5 76 -5 T 82 -18" stroke="#F43F5E" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round" />
  </g>

  <!-- Pialas (Tea Bowls) -->
  <g transform="translate(440, 345)">
    <ellipse cx="15" cy="12" rx="12" ry="7" fill="#FFFFFF" stroke="#FBBF24" stroke-width="1.5" />
    <ellipse cx="15" cy="10" rx="9" ry="4" fill="#3B82F6" />
  </g>
  <g transform="translate(325, 345)">
    <ellipse cx="15" cy="12" rx="12" ry="7" fill="#FFFFFF" stroke="#FBBF24" stroke-width="1.5" />
    <ellipse cx="15" cy="10" rx="9" ry="4" fill="#3B82F6" />
  </g>

  <!-- Fresh Golden Tandoori Flatbread (Lepyoshka) -->
  <g transform="translate(230, 340)">
    <ellipse cx="35" cy="22" rx="35" ry="18" fill="#F59E0B" stroke="#D97706" stroke-width="2" />
    <ellipse cx="35" cy="22" rx="20" ry="10" fill="#FDE68A" />
    <!-- Sesame center stamping (chekich) -->
    <circle cx="35" cy="22" r="8" fill="#B45309" opacity="0.7" />
  </g>

  <!-- Festive Fruit Bowl (Pomegranate, Grapes, Apples) -->
  <g transform="translate(500, 335)">
    <ellipse cx="30" cy="25" rx="32" ry="15" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2" />
    <!-- Pomegranate -->
    <circle cx="22" cy="18" r="12" fill="#E11D48" />
    <!-- Apple -->
    <circle cx="38" cy="16" r="10" fill="#84CC16" />
    <!-- Grapes cluster -->
    <circle cx="30" cy="10" r="5" fill="#881337" />
    <circle cx="36" cy="8" r="5" fill="#881337" />
  </g>

  <!-- Table Badge Pill -->
  <g transform="translate(320, 20)">
    <rect width="160" height="38" rx="19" fill="#881337" filter="url(#shadow6)" />
    <circle cx="22" cy="19" r="10" fill="#F43F5E" />
    <text x="22" y="24" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFF1F2" text-anchor="middle">6</text>
    <text x="92" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#FFF1F2" text-anchor="middle">СТОЛИК №6</text>
  </g>
</svg>
