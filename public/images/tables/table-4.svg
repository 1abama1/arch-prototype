<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED" />
      <stop offset="60%" stop-color="#FFEDD5" />
      <stop offset="100%" stop-color="#FED7AA" />
    </linearGradient>
    <linearGradient id="kitchenBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#292524" />
      <stop offset="100%" stop-color="#1C1917" />
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
    <linearGradient id="copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="50%" stop-color="#C2410C" />
      <stop offset="100%" stop-color="#7C2D12" />
    </linearGradient>
    <linearGradient id="steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7C2D12" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" rx="24" fill="url(#bg4)" />

  <!-- Open Kitchen Backdrop -->
  <rect x="40" y="40" width="720" height="250" rx="12" fill="url(#kitchenBack)" />

  <!-- Subway Tiles Subtle Grid -->
  <g stroke="#44403C" stroke-width="1" opacity="0.3">
    <line x1="40" y1="80" x2="760" y2="80" />
    <line x1="40" y1="120" x2="760" y2="120" />
    <line x1="40" y1="160" x2="760" y2="160" />
    <line x1="40" y1="200" x2="760" y2="200" />
    <line x1="40" y1="240" x2="760" y2="240" />
  </g>

  <!-- Stainless Steel Kitchen Hood / Exhaust -->
  <polygon points="260,40 540,40 500,120 300,120" fill="url(#steel)" opacity="0.9" />
  <rect x="290" y="120" width="220" height="15" rx="3" fill="#64748B" />

  <!-- Copper Pans Hanging on Rail -->
  <line x1="120" y1="90" x2="260" y2="90" stroke="#78716C" stroke-width="3" />
  <!-- Pan 1 -->
  <circle cx="150" cy="120" r="18" fill="url(#copper)" />
  <line x1="150" y1="90" x2="150" y2="102" stroke="#44403C" stroke-width="2" />
  <!-- Pan 2 -->
  <circle cx="200" cy="125" r="22" fill="url(#copper)" />
  <line x1="200" y1="90" x2="200" y2="103" stroke="#44403C" stroke-width="2" />

  <!-- Spice & Herb Shelf on Right -->
  <line x1="540" y1="90" x2="680" y2="90" stroke="#78716C" stroke-width="3" />
  <rect x="560" y="70" width="16" height="20" rx="2" fill="#10B981" />
  <rect x="585" y="65" width="18" height="25" rx="2" fill="#F59E0B" />
  <rect x="615" y="70" width="16" height="20" rx="2" fill="#EF4444" />
  <rect x="640" y="62" width="20" height="28" rx="2" fill="#84CC16" />

  <!-- Sizzling Grill Fire Flare behind Counter -->
  <path d="M 400 170 Q 385 210 395 240 Q 405 215 420 225 Q 410 195 400 170 Z" fill="url(#flame)" opacity="0.85" />
  <path d="M 380 200 Q 370 220 380 240 Q 390 225 380 200 Z" fill="#FDE047" opacity="0.9" />

  <!-- Chef's Table Solid Oak Counter -->
  <polygon points="0,280 800,280 800,500 0,500" fill="#7C2D12" />
  <polygon points="0,280 800,280 800,320 0,320" fill="#9A3412" />

  <!-- Center Presentation Slate Plate -->
  <ellipse cx="400" cy="400" rx="220" ry="65" fill="#1C1917" filter="url(#shadow4)" />
  <ellipse cx="400" cy="396" rx="205" ry="56" fill="#292524" />
  <ellipse cx="400" cy="392" rx="190" ry="48" stroke="#44403C" stroke-width="2" fill="none" />

  <!-- Gourmet Dish with Culinary Cloche / Cover Dome -->
  <!-- Cloche Dome Raised slightly -->
  <path d="M 330 360 C 330 280 470 280 470 360 Z" fill="url(#steel)" filter="url(#shadow4)" />
  <!-- Cloche Ring handle -->
  <ellipse cx="400" cy="275" rx="10" ry="10" fill="none" stroke="#64748B" stroke-width="4" />
  <ellipse cx="400" cy="360" rx="72" ry="14" fill="#94A3B8" />

  <!-- Fresh culinary herbs & Sauce drizzle -->
  <path d="M 280 410 Q 340 435 430 415 T 520 410" stroke="#EA580C" stroke-width="4" fill="none" stroke-linecap="round" />
  <circle cx="310" cy="415" r="5" fill="#10B981" />
  <circle cx="490" cy="415" r="5" fill="#10B981" />
  <circle cx="505" cy="410" r="4" fill="#F59E0B" />

  <!-- Chef Knife and Fork on Side -->
  <!-- Knife -->
  <polygon points="560,370 575,370 570,440 565,440" fill="#94A3B8" />
  <rect x="563" y="440" width="6" height="25" rx="2" fill="#1C1917" />
  <!-- Fork -->
  <line x1="230" y1="370" x2="230" y2="440" stroke="#94A3B8" stroke-width="4" />
  <rect x="227" y="440" width="6" height="25" rx="2" fill="#1C1917" />

  <!-- Table Badge Pill -->
  <g transform="translate(320, 20)">
    <rect width="160" height="38" rx="19" fill="#7C2D12" filter="url(#shadow4)" />
    <circle cx="22" cy="19" r="10" fill="#FB923C" />
    <text x="22" y="24" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7C2D12" text-anchor="middle">4</text>
    <text x="92" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#FFF7ED" text-anchor="middle">СТОЛИК №4</text>
  </g>
</svg>
